<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise Box</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8f3;--surface:#fff;--ink:#14161c;--muted:#596159;--line:#d6dfd5;--green:#1c8a2b;--on-green:#fff;--tag:#6fd13a;--on-tag:#10200a;--soft:#e5f3e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1b14;--surface:#172a1f;--ink:#e8f1ea;--muted:#9bb0a2;--line:#2b4235;--green:#5fd04a;--on-green:#08200a;--soft:#1d3527}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1b14;--surface:#172a1f;--ink:#e8f1ea;--muted:#9bb0a2;--line:#2b4235;--green:#5fd04a;--on-green:#08200a;--soft:#1d3527}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
a{color:inherit}
.bar{display:flex;align-items:center;gap:14px;padding:10px 0;flex-wrap:wrap}
.bar img{height:48px;width:48px;object-fit:cover;object-position:center 30%;border-radius:10px;background:#fff}
.menu{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.menu a{white-space:nowrap;text-decoration:none;font-weight:600;padding:6px 14px;border-radius:999px}
.menu a[aria-current="page"]{background:var(--green);color:var(--on-green)}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-weight:700;font-size:.82rem;padding:3px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
h1{font-size:clamp(1.7rem,4.6vw,2.7rem);line-height:1.3;margin:6px 0 8px;font-weight:800}
h2{font-size:1.35rem;margin:28px 0 8px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 16px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center;padding:14px 0}
.pic{width:100%;border-radius:18px 6px 18px 6px;display:block;border:1px solid var(--line)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 20px;background:var(--green);color:var(--on-green);cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--soft);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.84rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--muted);font-weight:600;margin-bottom:2px}
select,input{width:100%;font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.count{margin:6px 2px 12px;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 6px 18px;overflow:hidden;display:flex;flex-direction:column}
.box .ph{width:100%;height:150px;object-fit:cover;display:block}
.box .top{background:var(--soft);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:2px dashed var(--line)}
.box h3{margin:0;font-size:1.05rem}
.sub{font-size:.85rem;color:var(--muted)}
.price{white-space:nowrap;text-align:end}
.price b{display:inline-block;background:var(--tag);color:var(--on-tag);padding:1px 10px;border-radius:8px;font-size:1.1rem}
.price s{display:block;font-size:.8rem;color:var(--muted)}
.box .body{padding:12px 16px;flex:1;font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted)}
.box .foot{padding:0 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.left{font-size:.85rem;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 6px 18px;overflow:hidden}
.how img{width:100%;height:180px;object-fit:cover;display:block}
.how figcaption{padding:10px 14px;font-size:.92rem}
.how figcaption b{display:block}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 14px;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-weight:800}
.steps b{display:block}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trio div{background:var(--soft);border-radius:12px;padding:12px 16px}
.trio b{display:block;color:var(--green)}
.tl{font-size:.85rem;color:var(--muted);font-weight:600;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{font:inherit;font-weight:600;padding:7px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.form{display:grid;gap:12px;max-width:420px}
.ok{color:var(--green);font-weight:700;min-height:1.6em}
dialog{border:0;border-radius:16px;padding:22px;max-width:380px;width:calc(100% - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.code{font-size:2rem;font-weight:800;letter-spacing:.15em;text-align:center;background:var(--soft);border-radius:12px;padding:8px;margin:12px 0;direction:ltr}
.note{font-size:.85rem;color:var(--muted);margin:28px 0 32px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="bar">
  <img data-img="logo" alt="Surprise Box">
  <nav class="menu" id="menu" aria-label="main">
    <a href="#home" data-v="home" data-i="nav_home"></a>
    <a href="#boxes" data-v="boxes" data-i="nav_boxes"></a>
    <a href="#merchant" data-v="merchant" data-i="nav_merchant"></a>
    <a href="#how" data-v="how" data-i="nav_how"></a>
    <a href="#account" data-v="account" data-i="nav_account"></a>
  </nav>
  <div class="lang" role="group" aria-label="language">
    <button data-l="ar">AR</button><button data-l="fr">FR</button><button data-l="en">EN</button>
  </div>
</header>

<main>
<!-- HOME -->
<section id="v-home">
  <div class="hero">
    <div>
      <h1 data-i="h_title"></h1>
      <p class="lead" data-i="h_lead"></p>
      <div class="cta"><a class="btn" href="#boxes" data-i="cta_browse"></a><a class="btn alt" href="#merchant" data-i="cta_join"></a></div>
    </div>
    <img class="pic" data-img="bak" alt="">
  </div>
  <div class="stats">
    <div class="stat"><b id="st1">0</b><span data-i="st_boxes"></span></div>
    <div class="stat"><b id="st2">0</b><span data-i="st_shops"></span></div>
    <div class="stat"><b id="st3">0%</b><span data-i="st_save"></span></div>
  </div>
  <h2 data-i="feat_t"></h2>
  <div class="grid" id="featured"></div>
  <p><a href="#boxes" class="btn alt" data-i="feat_all"></a></p>
  <h2 data-i="what_t"></h2>
  <p class="lead" data-i="what_d"></p>
  <div class="how">
    <figure><img data-img="bak" alt=""><figcaption><b data-i="c1_t"></b><span data-i="c1_d"></span></figcaption></figure>
    <figure><img data-img="sup" alt=""><figcaption><b data-i="c2_t"></b><span data-i="c2_d"></span></figcaption></figure>
    <figure><img data-img="fam" alt=""><figcaption><b data-i="c3_t"></b><span data-i="c3_d"></span></figcaption></figure>
  </div>
</section>

<!-- BOXES -->
<section id="v-boxes" hidden>
  <h2 data-i="nav_boxes"></h2>
  <div class="panel"><div class="filters">
    <div><label for="wil" data-i="f_wil"></label><select id="wil"></select></div>
    <div><label for="com" data-i="f_com"></label><select id="com"></select></div>
    <div><label for="mx"><span data-i="f_max"></span>: <span id="mxv">800</span> <span class="cur"></span></label><input type="range" id="mx" min="100" max="1000" step="50" value="800"></div>
  </div>
  <div class="tl" data-i="f_type"></div><div class="chips" id="typ" role="group"></div></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="panel" style="margin-top:16px"><b data-i="mine"></b><div id="mine" class="sub"></div></div>
</section>

<!-- MERCHANT -->
<section id="v-merchant" hidden>
  <h2 data-i="m_title"></h2>
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span data-i="m_s1"></span></div>
    <div class="stat"><b id="s2">0</b><span data-i="m_s2"></span></div>
    <div class="stat"><b id="s3">0</b><span data-i="m_s3"></span></div>
  </div>
  <div class="panel"><b data-i="m_add"></b>
    <div class="filters" style="margin-top:10px">
      <div><label for="n" data-i="m_shop"></label><input id="n" value="Boulangerie El Amel"></div>
      <div style="grid-column:1/-1"><div class="tl" style="margin-top:0" data-i="f_type"></div><div class="chips" id="mt" role="group"></div></div>
      <div><label for="mw" data-i="f_wil"></label><select id="mw"></select></div>
      <div><label for="mc" data-i="f_com"></label><select id="mc"></select></div>
      <div><label for="mcx" data-i="m_cx"></label><input id="mcx"></div>
      <div><label for="mv" data-i="m_val"></label><input id="mv" type="number" value="1000" min="100"></div>
      <div><label for="mp" data-i="m_price"></label><input id="mp" type="number" value="400" min="50"></div>
      <div><label for="mq" data-i="m_qty"></label><input id="mq" type="number" value="5" min="1"></div>
      <div><label for="mh" data-i="m_time"></label><input id="mh" value="20:00 – 21:00"></div>
      <div style="grid-column:1/-1"><label for="md" data-i="m_desc"></label><input id="md" value="Croissants, pain, pâtisseries – 24h"></div>
    </div>
    <p style="margin:12px 0 0"><button class="btn" id="add" data-i="m_btn"></button> <span class="ok" id="addok"></span></p>
  </div>
  <div class="panel"><b data-i="m_orders"></b><div id="orders" class="sub"></div></div>
</section>

<!-- HOW -->
<section id="v-how" hidden>
  <h2 data-i="how_t"></h2>
  <ol class="steps">
    <li><div><b data-i="s1_t"></b><span class="sub" data-i="s1_d"></span></div></li>
    <li><div><b data-i="s2_t"></b><span class="sub" data-i="s2_d"></span></div></li>
    <li><div><b data-i="s3_t"></b><span class="sub" data-i="s3_d"></span></div></li>
    <li><div><b data-i="s4_t"></b><span class="sub" data-i="s4_d"></span></div></li>
    <li><div><b data-i="s5_t"></b><span class="sub" data-i="s5_d"></span></div></li>
  </ol>
  <h2 data-i="ben_t"></h2>
  <div class="trio">
    <div><b data-i="b1_t"></b><span data-i="b1_d"></span></div>
    <div><b data-i="b2_t"></b><span data-i="b2_d"></span></div>
    <div><b data-i="b3_t"></b><span data-i="b3_d"></span></div>
  </div>
  <p class="panel" style="margin-top:16px" data-i="saf"></p>
</section>

<!-- ACCOUNT -->
<section id="v-account" hidden>
  <h2 data-i="a_title"></h2>
  <div class="seg">
    <button id="r1" aria-pressed="true" data-i="a_c"></button>
    <button id="r2" aria-pressed="false" data-i="a_m"></button>
  </div>
  <div class="form panel">
    <div><label for="an" data-i="a_name"></label><input id="an"></div>
    <div><label for="ae" data-i="a_email"></label><input id="ae" type="email" dir="ltr"></div>
    <div><label for="ap" data-i="a_pass"></label><input id="ap" type="password" dir="ltr"></div>
    <div><button class="btn" id="reg" data-i="a_btn"></button></div>
    <div class="ok" id="regok"></div>
  </div>
</section>

<p class="note" data-i="demo"></p>
</main>
</div>

<dialog id="dlg">
  <h3 id="dt" style="margin-top:0"></h3>
  <div id="db"></div>
  <p style="margin-bottom:0;text-align:end"><button class="btn" id="dc"></button></p>
</dialog>

  '<div class="top"><div><h3>'+esc(pl(b.s))+'</h3><div class="sub">'+esc(TY[b.t][L])+' – '+esc(b.c==="__x"?b.cx:P[b.w].c[b.c][L])+'</div></div><div class="price"><b>'+b.p+' '+cur()+'</b><s>'+b.v+' '+cur()+'</s></div></div>'+
  '<div class="body">'+esc(pl(b.d))+'<div class="meta"><span class="chip">'+t("pick")+' '+esc(b.h)+'</span><span class="chip">'+t("save")+' '+off+'%</span></div></div>'+
  '<div class="foot"><span class="left">'+(ok?t("left")+' '+b.q:t("sold"))+'</span><button class="btn" data-id="'+b.id+'"'+(ok?'':' disabled')+'>'+t("reserve")+'</button></div></article>';
}
function bindReserve(root){var bs=root.querySelectorAll("[data-id]");for(var i=0;i<bs.length;i++)bs[i].onclick=function(){reserve(+this.getAttribute("data-id"))}}
function renderBoxes(){
  var w=$("wil").value,c=$("com").value,ty=curType,m=+$("mx").value;
  var list=boxes.filter(function(b){return b.w===w&&(!c||b.c===c)&&(!ty||b.t===ty)&&b.p<=m});
  $("count").textContent=list.length?t("found",{n:list.length,w:P[w].n[L]}):"";
  $("grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty panel" style="grid-column:1/-1">'+t("none")+'</div>';
  bindReserve($("grid"));
}
function renderHome(){
  var av=boxes.filter(function(b){return b.q>0});
  $("featured").innerHTML=av.slice(0,3).map(card).join("");bindReserve($("featured"));
  var shops={};boxes.forEach(function(b){shops[pl(b.s)]=1});
  var avg=boxes.length?Math.round(boxes.reduce(function(a,b){return a+(1-b.p/b.v)*100},0)/boxes.length):0;
  $("st1").textContent=av.length;$("st2").textContent=Object.keys(shops).length;$("st3").textContent=avg+"%";
}
function stats(){
  $("s1").textContent=boxes.length;$("s2").textContent=orders.length;
  $("s3").textContent=Math.round(orders.reduce(function(a,o){return a+o.b.p*0.9},0))+" "+cur();
  var h=orders.map(function(o){return '<div>'+o.code+' – '+esc(pl(o.b.s))+' – '+o.b.p+' '+cur()+'</div>'}).join("")||t("nores");
  $("mine").innerHTML=h;$("orders").innerHTML=h;
}
function reserve(id){
  var b=boxes.filter(function(x){return x.id===id})[0];if(!b||b.q<1)return;
  b.q--;var code="SB-"+Math.floor(1000+Math.random()*9000);orders.push({b:b,code:code});
  $("dt").textContent=t("d_t");
  $("db").innerHTML='<p>'+t("d_b",{s:"<b>"+esc(pl(b.s))+"</b>",h:esc(b.h),p:"<b>"+b.p+" "+cur()+"</b>"})+'</p><div class="code">'+code+'</div><p class="sub">'+t("d_h")+'</p>';
  $("dc").textContent=t("ok");$("dlg").showModal();renderAll();
}
$("dc").onclick=function(){$("dlg").close()};
function renderAll(){renderBoxes();renderHome();stats()}
function applyLang(){
  document.documentElement.lang=LANGS[L];document.documentElement.dir=L===0?"rtl":"ltr";
  document.title="Surprise Box – "+t("nav_home");
  var e=document.querySelectorAll("[data-i]");for(var i=0;i<e.length;i++)e[i].textContent=t(e[i].getAttribute("data-i"));
  var c=document.querySelectorAll(".cur");for(i=0;i<c.length;i++)c[i].textContent=cur();
  var lb=document.querySelectorAll(".lang button");for(i=0;i<lb.length;i++)lb[i].setAttribute("aria-pressed",lb[i].getAttribute("data-l")===LANGS[L]);
  fillSelects();renderAll();
  $("addok").textContent="";$("regok").textContent="";
}
function setLang(l){L=l;try{localStorage.setItem("sb-lang",LANGS[l])}catch(e){}applyLang()}
var lb=document.querySelectorAll(".lang button");
for(var i=0;i<lb.length;i++)lb[i].onclick=function(){setLang(LANGS.indexOf(this.getAttribute("data-l")))};
var im=document.querySelectorAll("[data-img]");for(i=0;i<im.length;i++)im[i].src=IMG[im[i].getAttribute("data-img")];
$("wil").onchange=function(){opts($("com"),comPairs(this.value),t("f_all_com"),"");renderBoxes()};
$("mw").onchange=function(){opts($("mc"),comPairs(this.value),null,"")};
$("com").onchange=renderBoxes;$("typ").onchange=renderBoxes;
$("mx").oninput=function(){$("mxv").textContent=this.value;renderBoxes()};
$("add").onclick=function(){
  var v=+$("mv").value,p=+$("mp").value,q=+$("mq").value,n=$("n").value.trim();
  if(!n||!(p>0)||!(q>0)||p>=v){$("addok").textContent=t("m_err");return}
  var d=$("md").value;
  var cx=$("mcx").value.trim();boxes.unshift({id:nid++,s:n,t:mtype,w:$("mw").value,c:cx?"__x":$("mc").value,cx:cx,v:v,p:p,q:q,h:$("mh").value,d:d});
  $("addok").textContent=t("m_ok");renderAll();
};
var role=1;
$("r1").onclick=function(){role=1;$("r1").setAttribute("aria-pressed",true);$("r2").setAttribute("aria-pressed",false)};
$("r2").onclick=function(){role=2;$("r2").setAttribute("aria-pressed",true);$("r1").setAttribute("aria-pressed",false)};
$("reg").onclick=function(){
  var n=$("an").value.trim(),m=$("ae").value.trim();
  $("regok").textContent=(!n||!m)?t("a_err"):t("a_ok",{n:n});
  if(n&&m)location.hash=role===2?"merchant":"boxes";
};
function route(){
  var h=(location.hash||"#home").slice(1);if(!document.getElementById("v-"+h))h="home";
  ["home","boxes","merchant","how","account"].forEach(function(v){$("v-"+v).hidden=v!==h});
  var a=document.querySelectorAll(".menu a");for(var i=0;i<a.length;i++){if(a[i].getAttribute("data-v")===h)a[i].setAttribute("aria-current","page");else a[i].removeAttribute("aria-current")}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
try{var sv=localStorage.getItem("sb-lang");if(sv&&LANGS.indexOf(sv)>=0)L=LANGS.indexOf(sv)}catch(e){}
$("wil").innerHTML='<option value="13"></option>';$("mw").innerHTML='<option value="13"></option>';
applyLang();route();
</script>
</body>
</html>
