<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surprise Box</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ef;--surface:#fff;--ink:#26352c;--title:#1c4a3a;--muted:#6d746d;--line:#e8e1d2;--green:#1f5c46;--on-green:#fff;--accent:#e0822f;--soft:#f5ecdb;--tint:#e8efe5;--badge:#b24a14;--shadow:0 6px 22px rgba(60,50,20,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121c17;--surface:#1a2a22;--ink:#e6efe8;--title:#a9dcc0;--muted:#9bb0a2;--line:#2c4337;--green:#4aa87c;--on-green:#06210f;--accent:#f0953f;--soft:#24352b;--tint:#1d3027;--badge:#ffb27a;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121c17;--surface:#1a2a22;--ink:#e6efe8;--title:#a9dcc0;--muted:#9bb0a2;--line:#2c4337;--green:#4aa87c;--on-green:#06210f;--accent:#f0953f;--soft:#24352b;--tint:#1d3027;--badge:#ffb27a;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:14px 0 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:1.35rem;color:var(--title)}
.brand img{height:54px;width:54px;object-fit:cover;object-position:center 28%;border-radius:12px;background:#fff}
.tools{display:flex;gap:10px;align-items:center}
.menu{display:flex;gap:6px;overflow-x:auto;flex:1 0 100%;padding:2px 0 8px;border-bottom:1px solid var(--line)}
.menu a{white-space:nowrap;text-decoration:none;font-weight:700;padding:6px 16px;border-radius:999px;color:var(--ink)}
.menu a[aria-current="page"]{background:var(--green);color:var(--on-green)}
/* controls */
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 22px;background:var(--green);color:var(--on-green);cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{width:100%;font:inherit;font-weight:600;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.tools select{width:auto}
label{display:block;font-size:.88rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{font:inherit;font-weight:700;padding:8px 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0 14px}
.fl2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
.fl2 select{width:auto;min-width:170px}
/* hero */
h1{font-size:clamp(1.8rem,4.8vw,2.8rem);line-height:1.3;margin:6px 0 8px;font-weight:800;color:var(--title)}
h1 .l{display:block}h1 .l2{color:var(--accent)}
h2{font-size:1.4rem;margin:30px 0 10px;color:var(--title)}
.lead{color:var(--muted);max-width:56ch;margin:0 0 16px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center;padding:18px 0}
.pic{width:100%;border-radius:24px;display:block;border:1px solid var(--line);box-shadow:var(--shadow)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.eb{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--title)}
.eb::before{content:"";width:34px;height:2px;background:var(--accent)}
/* offer cards */
.count{margin:6px 2px 12px;color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column}
.card .im{position:relative}
.card .im img{width:100%;height:200px;object-fit:cover;display:block}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:#fff;color:var(--badge);font-weight:800;font-size:.85rem;padding:2px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cb{padding:14px 18px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--tint);color:var(--green);font-weight:700;font-size:.82rem;padding:2px 14px;border-radius:999px;display:inline-block}
.km{font-size:.85rem;color:var(--muted)}
.card h3{margin:6px 0 0;font-size:1.25rem;font-weight:800}
.sub{font-size:.88rem;color:var(--muted);margin:0}
.r2{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.pr b{font-size:1.7rem;font-weight:800;color:var(--title)}
.pr s{color:var(--muted);font-size:.85rem;margin-inline-start:8px}
.left{font-size:.85rem;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}
/* modal */
dialog{border:0;border-radius:24px;padding:0;max-width:600px;width:calc(100% - 28px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,30,24,.55)}
.dlgin{max-height:88vh;overflow:auto}
.dlgin>img{width:100%;height:190px;object-fit:cover;display:block}
.md{padding:18px 24px 24px}
.md h2{margin:8px 0 4px;font-size:1.7rem}
.rows>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.rows dt{color:var(--muted)}.rows dd{margin:0;font-weight:700;text-align:end}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .btn:first-child{flex:1}
.err{color:#c0392b;font-weight:700;min-height:1.5em;margin:8px 0 0}
.code{font-size:2rem;font-weight:800;letter-spacing:.15em;text-align:center;background:var(--tint);border-radius:14px;padding:8px;margin:14px 0;direction:ltr;color:var(--title)}
.xbtn{border:0;background:none;font-size:1.5rem;cursor:pointer;color:var(--ink);padding:0 6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.hint{display:block;margin-top:6px;background:#fdeadc;color:#8a3b0d;font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:10px}
/* seller + stats */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px}
.sc.t2{background:var(--soft)}
.sc span{display:block;font-size:.88rem;color:var(--muted);font-weight:600}
.sc b{display:block;font-size:2rem;font-weight:800;color:var(--title);line-height:1.4}
.note{background:var(--soft);border-radius:14px;padding:10px 18px;font-size:.88rem;margin:10px 0;color:var(--ink)}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-weight:700;font-size:.85rem}
tr:last-child td{border-bottom:0}
td .sub{font-size:.8rem}
.ib{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:1rem;color:var(--ink)}
.banner{background:linear-gradient(135deg,var(--tint),var(--soft));border-radius:26px;padding:34px 34px;position:relative;overflow:hidden;margin:16px 0}
.banner::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}
.banner h1{font-size:clamp(1.8rem,4.5vw,2.8rem);margin:10px 0 4px}
.pct{display:flex;align-items:center;gap:12px;margin-top:14px;font-weight:700;position:relative;z-index:1}
.pct b{background:var(--surface);color:var(--title);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-weight:800}
.steps b{display:block}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.trio div{background:var(--tint);border-radius:16px;padding:14px 18px}
.trio b{display:block;color:var(--green)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.how img{width:100%;height:180px;object-fit:cover;display:block}
.how figcaption{padding:10px 16px;font-size:.92rem}.how figcaption b{display:block}
.foot{font-size:.85rem;color:var(--muted);margin:30px 0 36px}
@media(max-width:700px){.hero{grid-template-columns:1fr}.two,.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="bar">
  <a class="brand" href="#home"><img data-img="logo" alt=""><span>Surprise Box</span></a>
  <div class="tools">
    <select id="lang" aria-label="language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
    <a class="btn" href="#seller">🏪 <span data-i="cta_seller"></span></a>
  </div>
  <nav class="menu" aria-label="main">
    <a href="#home" data-v="home" data-i="nav_home"></a>
    <a href="#offers" data-v="offers" data-i="nav_boxes"></a>
    <a href="#seller" data-v="seller" data-i="nav_merchant"></a>
    <a href="#stats" data-v="stats" data-i="nav_stats"></a>
    <a href="#how" data-v="how" data-i="nav_how"></a>
  </nav>
</header>

<main>
<!-- HOME -->
<section id="v-home">
  <div class="hero">
    <div>
      <h1><span class="l" data-i="h_t1"></span><span class="l l2" data-i="h_t2"></span><span class="l" data-i="h_t3"></span></h1>
      <p class="lead" data-i="h_lead"></p>
      <div class="cta"><a class="btn" href="#offers" data-i="cta_browse"></a><a class="btn ghost" href="#seller" data-i="cta_join"></a></div>
    </div>
    <img class="pic" data-img="bak" alt="">
  </div>
  <div class="sgrid">
    <div class="sc"><span data-i="st_boxes"></span><b id="st1">0</b></div>
    <div class="sc"><span data-i="st_shops"></span><b id="st2">0</b></div>
    <div class="sc"><span data-i="st_save"></span><b id="st3">0%</b></div>
  </div>
  <h2 data-i="feat_t"></h2>
  <div class="grid" id="featured"></div>
  <p><a href="#offers" class="btn ghost" data-i="feat_all"></a></p>
  <h2 data-i="what_t"></h2>
  <p class="lead" data-i="what_d"></p>
  <div class="how">
    <figure><img data-img="b5" alt=""><figcaption><b data-i="c1_t"></b><span data-i="c1_d"></span></figcaption></figure>
    <figure><img data-img="sup" alt=""><figcaption><b data-i="c2_t"></b><span data-i="c2_d"></span></figcaption></figure>
    <figure><img data-img="fam" alt=""><figcaption><b data-i="c3_t"></b><span data-i="c3_d"></span></figcaption></figure>
  </div>
</section>

<!-- OFFERS -->
<section id="v-offers" hidden>
  <div class="fl">
    <div><label for="wil" data-i="f_wil"></label><select id="wil"></select></div>
    <div><label for="com" data-i="f_com"></label><select id="com"></select></div>
    <div><label for="shp" data-i="f_shop"></label><select id="shp"></select></div>
  </div>
  <div class="chips" id="cats" role="group"></div>
  <div class="fl2"><select id="srt" aria-label="sort"></select><div class="chips" id="knd" role="group"></div></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- SELLER -->
<section id="v-seller" hidden>
  <div class="eb" data-i="sl_eyebrow" style="margin-top:20px"></div>
  <div class="sgrid">
    <div class="sc"><span data-i="sl_active"></span><b id="a1">0</b></div>
    <div class="sc"><span data-i="sl_booked"></span><b id="a2">0</b></div>
    <div class="sc"><span data-i="sl_avail"></span><b id="a3">0</b></div>
    <div class="sc t2"><span data-i="sl_sales"></span><b id="a4">0</b></div>
    <div class="sc t2"><span data-i="sl_fee"></span><b id="a5">0</b></div>
    <div class="sc t2"><span data-i="sl_net"></span><b id="a6">0</b></div>
  </div>
  <div class="note" data-i="sl_note"></div>
  <p><button class="btn" id="addbtn">＋ <span data-i="sl_add"></span></button></p>
  <h2 data-i="sl_public" style="margin-top:10px"></h2>
  <div class="tw"><table><thead><tr><th data-i="th_offer"></th><th data-i="th_price"></th><th data-i="th_avail"></th><th data-i="th_pick"></th><th data-i="th_act"></th></tr></thead><tbody id="trows"></tbody></table></div>
  <h2 data-i="m_orders"></h2>
  <div class="tw"><table><thead><tr><th data-i="th_order"></th><th data-i="th_total"></th><th data-i="th_fee"></th><th data-i="th_net"></th><th data-i="th_act"></th></tr></thead><tbody id="orows"></tbody></table></div>
</section>

<!-- STATS -->
<section id="v-stats" hidden>
  <div class="banner">
    <div class="eb" data-i="stt_eyebrow"></div>
    <h1 data-i="stt_title"></h1>
    <p class="lead" style="margin:0" data-i="stt_sub"></p>
    <div class="pct"><b id="pc"></b><span data-i="stt_badge"></span></div>
  </div>
  <div class="sgrid">
    <div class="sc"><span data-i="stt_sold"></span><b id="z1">0</b></div>
    <div class="sc"><span data-i="stt_saved"></span><b id="z2">0</b></div>
    <div class="sc"><span data-i="stt_shops"></span><b id="z3">0</b></div>
    <div class="sc"><span data-i="stt_cust"></span><b id="z4">0</b></div>
    <div class="sc"><span data-i="stt_orders"></span><b id="z5">0</b></div>
    <div class="sc t2"><span data-i="stt_gross"></span><b id="z6">0</b></div>
    <div class="sc t2"><span data-i="stt_fee"></span><b id="z7">0</b></div>
    <div class="sc t2"><span data-i="stt_net"></span><b id="z8">0</b></div>
  </div>
  <div class="note" data-i="stt_n1"></div>
  <div class="note" data-i="sl_note"></div>
</section>

<!-- HOW -->
<section id="v-how" hidden>
  <h2 data-i="how_t"></h2>
  <ol class="steps">
    <li><div><b data-i="s1_t"></b><span class="sub" data-i="s1_d"></span></div></li>
    <li><div><b data-i="s2_t"></b><span class="sub" data-i="s2_d"></span></div></li>
    <li><div><b data-i="s3_t"></b><span class="sub" data-i="s3_d"></span></div></li>
    <li><div><b data-i="s4_t"></b><span class="sub" data-i="s4_d"></span></div></li>
    <li><div><b data-i="s5_t"></b><span class="sub" data-i="s5_d"></span></div></li>
  </ol>
  <h2 data-i="ben_t"></h2>
  <div class="trio">
    <div><b data-i="b1_t"></b><span data-i="b1_d"></span></div>
    <div><b data-i="b2_t"></b><span data-i="b2_d"></span></div>
    <div><b data-i="b3_t"></b><span data-i="b3_d"></span></div>
  </div>
  <p class="note" style="margin-top:16px" data-i="saf"></p>
</section>

<p class="foot" data-i="demo"></p>
</main>
</div>

<!-- offer / booking dialog -->
<dialog id="dlg"><div class="dlgin" id="db"></div></dialog>

<!-- seller form dialog -->
<dialog id="fdlg"><div class="dlgin"><div class="md">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="eb" data-i="sl_eyebrow"></div><button class="xbtn" id="fx" aria-label="close">×</button></div>
  <h2 id="ftitle" style="margin-top:6px"></h2>
  <p class="sub" data-i="fm_desc"></p>
  <div class="fgrid">
    <div class="full"><label for="fn" data-i="fm_name"></label><input id="fn"></div>
    <div><label for="fst" data-i="fm_stype"></label><select id="fst"></select></div>
    <div><label for="fsh" data-i="fm_shop"></label><input id="fsh"></div>
    <div><label for="fw" data-i="f_wil"></label><select id="fw"></select></div>
    <div><label for="fc" data-i="f_com"></label><select id="fc"></select></div>
    <div><label for="fnb" data-i="fm_nb"></label><input id="fnb"></div>
    <div><label for="fad" data-i="fm_addr"></label><input id="fad"></div>
    <div class="full"><label for="fd" data-i="fm_contents"></label><textarea id="fd"></textarea></div>
    <div><label for="fcat" data-i="fm_cat"></label><select id="fcat"></select></div>
    <div><label for="fkind" data-i="fm_kind"></label><select id="fkind"></select></div>
    <div class="full"><label for="fex" data-i="fm_expiry"></label><input id="fex" type="date"><span class="hint" data-i="fm_expiry_h"></span></div>
    <div><label for="fkm" data-i="fm_km"></label><input id="fkm" type="number" min="0" step="0.1" value="1"></div>
    <div><label for="fv" data-i="fm_orig"></label><input id="fv" type="number" min="0" value="1000"></div>
    <div><label for="fp" data-i="fm_price"></label><input id="fp" type="number" min="0" value="400"></div>
    <div><label for="fq" data-i="fm_qty"></label><input id="fq" type="number" min="1" value="5"></div>
    <div><label for="ff" data-i="fm_from"></label><input id="ff" type="time" value="17:30"></div>
    <div><label for="fe" data-i="fm_to"></label><input id="fe" type="time" value="19:30"></div>
  </div>
  <p class="err" id="ferr"></p>
  <div class="acts"><button class="btn" id="fsave"></button><button class="btn ghost" id="fcancel" data-i="fm_cancel"></button></div>

function $(i){return document.getElementById(i)}
function t(k,o){var s=K[k]?K[k][L]:k;if(o)for(var x in o)s=s.replace("{"+x+"}",o[x]);return s}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pl(x){return typeof x==="string"?x:x[L]}
function cur(){return K.cur[L]}
function disc(b){return Math.round((1-b.p/b.v)*100)}
function loc(b){return P[b.w].c[b.c][L]}
function sub(b){return [pl(b.sh),pl(b.nb),loc(b),P[b.w].n[L]].filter(Boolean).join(" · ")}
function byId(id){return offers.filter(function(x){return x.id===+id})[0]}
function opts(sel,pairs,all,keep){var v=keep!==undefined?keep:sel.value;sel.innerHTML=(all?'<option value="">'+esc(all)+'</option>':'')+pairs.map(function(p){return '<option value="'+p[0]+'">'+esc(p[1])+'</option>'}).join("");if(v)sel.value=v;if(sel.value!==v)sel.selectedIndex=0}
function chips(el,pairs,cur_,all,fn){
  var a=(all?[["",all]]:[]).concat(pairs);
  el.innerHTML=a.map(function(p){return '<button type="button" data-v="'+p[0]+'" aria-pressed="'+(p[0]===cur_)+'">'+esc(p[1])+'</button>'}).join("");
  var bs=el.querySelectorAll("button");for(var i=0;i<bs.length;i++)bs[i].onclick=function(){fn(this.getAttribute("data-v"))};
}
function wilPairs(){return Object.keys(P).sort(function(a,b){return a-b}).map(function(k){return [k,P[k].n[L]+" ("+k+")"]})}
function comPairs(w){var c=P[w].c;return Object.keys(c).map(function(k){return [k,c[k][L]]})}
function typPairs(){return Object.keys(TY).map(function(k){return [k,TY[k][L]]})}
function catPairs(){return CATS.map(function(c){return [c,t("cat_"+c)]})}
function kindPairs(){return KINDS.map(function(c){return [c,t("kind_"+c)]})}

function card(b){
  return '<article class="card" tabindex="0" role="button" data-id="'+b.id+'"><div class="im"><img src="'+IMG[CI[b.cat]]+'" alt=""><span class="badge">'+t("save")+' '+disc(b)+'%</span></div>'+
  '<div class="cb"><div class="r1"><span class="tag">'+esc(t("cat_"+b.cat))+'</span><span class="km">📍 '+b.km+' '+t("km")+'</span></div>'+
  '<h3>'+esc(pl(b.ti))+'</h3><p class="sub">'+esc(sub(b))+'</p>'+
  '<div class="r2"><div class="pr"><b>'+b.p+' '+cur()+'</b><s>'+b.v+'</s></div><span class="left">'+(b.q>0?t("left_n",{n:b.q}):t("sold"))+'</span></div></div></article>';
}
function renderOffers(){
  var w=$("wil").value,c=$("com").value,shp=$("shp").value;
  var inW=offers.filter(function(b){return b.w===w&&(!c||b.c===c)});
  var names=[];inW.forEach(function(b){var n=pl(b.sh);if(names.indexOf(n)<0)names.push(n)});
  opts($("shp"),names.map(function(n){return [n,n]}),t("f_all_shops"),shp);
  shp=$("shp").value;
  var list=inW.filter(function(b){return(!shp||pl(b.sh)===shp)&&(!curCat||b.cat===curCat)&&(!curKind||b.kind===curKind)});
  var s=$("srt").value||"near";
  list.sort(function(a,b){return s==="cheap"?a.p-b.p:s==="disc"?disc(b)-disc(a):s==="stock"?b.q-a.q:a.km-b.km});
  $("count").textContent=list.length?t("found",{n:list.length,w:P[w].n[L]}):"";
  $("grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty">'+t("none")+'</div>';
}
function renderHome(){
  var av=offers.filter(function(b){return b.q>0});
  $("featured").innerHTML=av.slice(0,3).map(card).join("");
  var sh={};offers.forEach(function(b){sh[pl(b.sh)]=1});
  var avg=offers.length?Math.round(offers.reduce(function(a,b){return a+disc(b)},0)/offers.length):0;
  $("st1").textContent=av.reduce(function(a,b){return a+b.q},0);$("st2").textContent=Object.keys(sh).length;$("st3").textContent=avg+"%";
}
function totals(){
  var ok=orders.filter(function(o){return o.st==="ok"});
  var g=0,f=0,n=0,q=0,cu={};ok.forEach(function(o){g+=o.total;f+=o.fee;n+=o.net;q+=o.q;cu[o.name.toLowerCase()]=1});
  return {ok:ok,gross:g,fee:f,net:n,qty:q,cust:Object.keys(cu).length};
}
function money(n){return n+" "+cur()}
function renderSeller(){
  var T=totals();
  $("a1").textContent=offers.filter(function(b){return b.q>0}).length;$("a2").textContent=T.qty;
  $("a3").textContent=offers.reduce(function(a,b){return a+b.q},0);
  $("a4").textContent=money(T.gross);$("a5").textContent=money(T.fee);$("a6").textContent=money(T.net);
  $("trows").innerHTML=offers.map(function(b){return '<tr><td><b>'+esc(pl(b.ti))+'</b><div class="sub">'+esc(sub(b))+'</div></td><td>'+money(b.p)+'</td><td>'+t("unit",{n:b.q})+'</td><td dir="ltr" style="text-align:start">'+b.f+' – '+b.e+'</td><td><button class="ib" data-act="del" data-id="'+b.id+'" aria-label="delete">🗑</button> <button class="ib" data-act="edit" data-id="'+b.id+'" aria-label="edit">✏️</button></td></tr>'}).join("")||'<tr><td colspan="5" class="sub">'+t("nores")+'</td></tr>';
  $("orows").innerHTML=orders.map(function(o,i){var ok=o.st==="ok";return '<tr><td><b>'+o.code+'</b><div class="sub">'+esc(o.name)+' · '+esc(pl(o.ti))+' × '+o.q+'</div></td><td>'+money(o.total)+'</td><td>'+(ok?money(o.fee):"—")+'</td><td>'+(ok?money(o.net):"—")+'</td><td>'+(ok?'<button class="btn ghost" style="padding:4px 12px" data-act="cancel" data-i2="'+i+'">'+t("o_cancel")+'</button>':'<span class="sub">'+t("o_canceled")+'</span>')+'</td></tr>'}).join("")||'<tr><td colspan="5" class="sub">'+t("nores")+'</td></tr>';
}
function renderStats(){
  var T=totals(),sh={};T.ok.forEach(function(o){sh[pl(o.sh)]=1});
  var allSh={};offers.forEach(function(b){allSh[pl(b.sh)]=1});
  $("pc").textContent=COMM+"%";
  $("z1").textContent=T.qty;$("z2").textContent=T.qty;$("z3").textContent=Object.keys(allSh).length;$("z4").textContent=T.cust;$("z5").textContent=T.ok.length;
  $("z6").textContent=money(T.gross);$("z7").textContent=money(T.fee);$("z8").textContent=money(T.net);
}
function renderAll(){renderOffers();renderHome();renderSeller();renderStats()}

/* offer details + booking */
function openOffer(id){
  var b=byId(id);if(!b)return;
  $("db").innerHTML='<img src="'+IMG[CI[b.cat]]+'" alt=""><div class="md"><span class="tag">'+esc(t("cat_"+b.cat))+'</span><h2>'+esc(pl(b.ti))+'</h2><p class="sub" style="font-size:1rem">'+esc(pl(b.d))+'</p>'+
  '<dl class="rows"><div><dt>'+t("md_type")+'</dt><dd>'+esc(TY[b.st][L]+" · "+pl(b.sh))+'</dd></div><div><dt>'+t("md_loc")+'</dt><dd>'+esc(P[b.w].n[L]+" · "+loc(b)+" · "+pl(b.nb))+'</dd></div><div><dt>'+t("md_addr")+'</dt><dd>'+esc(pl(b.ad))+'</dd></div><div><dt>'+t("md_time")+'</dt><dd dir="ltr">'+b.f+' – '+b.e+'</dd></div><div><dt>'+t("md_price")+'</dt><dd>'+b.p+' '+cur()+' <s class="sub">'+b.v+' '+cur()+'</s></dd></div></dl>'+
  '<div class="two"><div><label for="rn">'+t("md_name")+'</label><input id="rn" placeholder="'+esc(t("md_name_ph"))+'" autocomplete="name"></div><div><label for="rq">'+t("md_qty")+'</label><input id="rq" type="number" min="1" max="'+b.q+'" value="1"></div></div>'+
  '<p class="err" id="rerr"></p><div class="acts"><button class="btn" id="rgo"'+(b.q>0?'':' disabled')+'></button><button class="btn ghost" id="rback">'+t("md_back")+'</button></div></div>';
  function lab(){var q=Math.max(1,Math.floor(+$("rq").value)||1);$("rgo").textContent=t("md_book",{p:b.p*q+" "+cur()})}
  lab();$("rq").oninput=lab;$("rback").onclick=function(){$("dlg").close()};
  $("rgo").onclick=function(){book(b)};
  $("dlg").showModal();
}
function book(b){
  var n=$("rn").value.trim(),q=Math.floor(+$("rq").value);
  if(n.length<2){$("rerr").textContent=t("e_name");return}
  if(!(q>=1&&q<=b.q)){$("rerr").textContent=t("e_qty");return}
  b.q-=q;var total=b.p*q,fee=Math.round(total*COMM/100),code="SB-"+(1000+Math.floor(Math.random()*9000));
  orders.unshift({code:code,id:b.id,q:q,total:total,fee:fee,net:total-fee,name:n,st:"ok",sh:b.sh,ti:b.ti});
  $("db").innerHTML='<img src="'+IMG[CI[b.cat]]+'" alt=""><div class="md"><h2>✅ '+t("md_done")+'</h2><p>'+t("d_b",{s:"<b>"+esc(pl(b.sh))+"</b>",h:b.f+" – "+b.e,p:"<b>"+total+" "+cur()+"</b>"})+'</p><div class="code">'+code+'</div><p class="sub">'+t("d_h")+'</p><div class="acts"><button class="btn" id="rok">'+t("ok")+'</button></div></div>';
  $("rok").onclick=function(){$("dlg").close()};
  renderAll();
}
document.addEventListener("click",function(e){
  var c=e.target.closest(".card");if(c){openOffer(c.getAttribute("data-id"));return}
  var a=e.target.closest("[data-act]");if(!a)return;
  var act=a.getAttribute("data-act");
  if(act==="del"){offers=offers.filter(function(x){return x.id!==+a.getAttribute("data-id")});renderAll()}
  else if(act==="edit")openForm(+a.getAttribute("data-id"));
  else if(act==="cancel"){var o=orders[+a.getAttribute("data-i2")];if(o&&o.st==="ok"){o.st="canceled";var b=byId(o.id);if(b)b.q+=o.q;renderAll()}}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("card"))openOffer(e.target.getAttribute("data-id"))});

/* seller form */
function fillForm(){
  opts($("fst"),typPairs());opts($("fw"),wilPairs());opts($("fc"),comPairs($("fw").value));opts($("fcat"),catPairs());opts($("fkind"),kindPairs());
}
function openForm(id){
  editId=id||0;var b=editId?byId(editId):null;fillForm();
  $("ftitle").textContent=t(b?"fm_edit":"fm_title");$("fsave").textContent=t(b?"fm_save":"fm_publish");$("ferr").textContent="";
  if(b){$("fn").value=pl(b.ti);$("fst").value=b.st;$("fsh").value=pl(b.sh);$("fw").value=b.w;opts($("fc"),comPairs(b.w),null,b.c);$("fnb").value=pl(b.nb);$("fad").value=pl(b.ad);$("fd").value=pl(b.d);$("fcat").value=b.cat;$("fkind").value=b.kind;$("fkm").value=b.km;$("fv").value=b.v;$("fp").value=b.p;$("fq").value=b.q;$("ff").value=b.f;$("fe").value=b.e}
  else{["fn","fsh","fnb","fad","fd","fex"].forEach(function(i){$(i).value=""});$("fkm").value=1;$("fv").value=1000;$("fp").value=400;$("fq").value=5;$("ff").value="17:30";$("fe").value="19:30"}
  $("fdlg").showModal();
}
$("addbtn").onclick=function(){openForm(0)};
$("fx").onclick=$("fcancel").onclick=function(){$("fdlg").close()};
$("fw").onchange=function(){opts($("fc"),comPairs(this.value),null,"")};
$("fsave").onclick=function(){
  var ti=$("fn").value.trim(),sh=$("fsh").value.trim(),v=+$("fv").value,p=+$("fp").value,q=Math.floor(+$("fq").value);
  if(!ti||!sh||!(p>0)||!(v>=p)||!(q>=1)){$("ferr").textContent=t("fm_err");return}
  var o={st:$("fst").value,cat:$("fcat").value,kind:$("fkind").value,w:$("fw").value,c:$("fc").value,km:+$("fkm").value||0,v:v,p:p,q:q,f:$("ff").value||"17:30",e:$("fe").value||"19:30",sh:sh,ti:ti,nb:$("fnb").value.trim(),ad:$("fad").value.trim(),d:$("fd").value.trim()||ti};
  if(editId){var b=byId(editId);for(var k in o)b[k]=o[k]}else{o.id=nid++;offers.unshift(o)}
  $("fdlg").close();renderAll();
};

/* language, filters, routing */
function fillSelects(){
  opts($("wil"),wilPairs());opts($("com"),comPairs($("wil").value),t("f_all_com"));
  chips($("cats"),catPairs(),curCat,t("cat_all"),function(v){curCat=v;fillSelects();renderOffers()});
  chips($("knd"),kindPairs(),curKind,null,function(v){curKind=curKind===v?"":v;fillSelects();renderOffers()});
  var s=$("srt").value||"near";$("srt").innerHTML=["near","cheap","disc","stock"].map(function(k){return '<option value="'+k+'">'+esc(t("sort_"+k))+'</option>'}).join("");$("srt").value=s;
}
function applyLang(){
  document.documentElement.lang=LANGS[L];document.documentElement.dir=L===0?"rtl":"ltr";
  document.title="Surprise Box – "+t("nav_home");
  var e=document.querySelectorAll("[data-i]");for(var i=0;i<e.length;i++)e[i].textContent=t(e[i].getAttribute("data-i"));
  $("lang").value=LANGS[L];fillSelects();renderAll();
}
function setLang(l){L=l;try{localStorage.setItem("sb-lang",LANGS[l])}catch(e){}applyLang()}
$("lang").onchange=function(){setLang(LANGS.indexOf(this.value))};
var im=document.querySelectorAll("[data-img]");for(var i=0;i<im.length;i++)im[i].src=IMG[im[i].getAttribute("data-img")];
$("wil").onchange=function(){opts($("com"),comPairs(this.value),t("f_all_com"),"");$("shp").value="";renderOffers()};
$("com").onchange=function(){$("shp").value="";renderOffers()};$("shp").onchange=renderOffers;$("srt").onchange=renderOffers;
var VIEWS=["home","offers","seller","stats","how"];
function route(){
  var h=(location.hash||"#home").slice(1);if(VIEWS.indexOf(h)<0)h="home";
  VIEWS.forEach(function(v){$("v-"+v).hidden=v!==h});
  var a=document.querySelectorAll(".menu a");for(var i=0;i<a.length;i++){if(a[i].getAttribute("data-v")===h)a[i].setAttribute("aria-current","page");else a[i].removeAttribute("aria-current")}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
try{var sv=localStorage.getItem("sb-lang");if(sv&&LANGS.indexOf(sv)>=0)L=LANGS.indexOf(sv)}catch(e){}
$("wil").innerHTML='<option value="16"></option>';
applyLang();route();
</script>
